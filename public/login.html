<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Suporte Técnico</title>
  <link rel="stylesheet" href="./css/main.css">
  <style>
    body.login-page {
      background: linear-gradient(135deg, #ffffff 0%, #E7B111 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    .login-container {
      background: white;
      border-radius: 8px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
      width: 100%;
      max-width: 420px;
      padding: 40px;
      box-sizing: border-box;
    }

    .login-header {
      text-align: center;
      margin-bottom: 30px;
    }

    .login-header h1 {
      margin: 0 0 10px;
      font-size: 28px;
      color: #333;
      font-weight: 600;
    }

    .login-header p {
      margin: 0;
      color: #999;
      font-size: 14px;
    }

    .login-form {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-group label {
      font-size: 14px;
      font-weight: 500;
      color: #333;
    }

    .form-group input {
      padding: 12px 14px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 14px;
      font-family: inherit;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .form-group input:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }

    .login-button {
      padding: 12px 16px;
      background: #667eea;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
      margin-top: 8px;
    }

    .login-button:hover {
      background-color: #5568d3;
    }

    .login-button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .login-error {
      background-color: #fee;
      border: 1px solid #fcc;
      border-radius: 6px;
      padding: 12px 14px;
      color: #c33;
      font-size: 14px;
      display: none;
      text-align: center;
    }

    .login-error.show {
      display: block;
    }

    .login-footer {
      text-align: center;
      margin-top: 20px;
      font-size: 14px;
      color: #999;
    }

    .loading {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid #f3f3f3;
      border-top: 2px solid #667eea;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-right: 8px;
      vertical-align: middle;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body class="login-page">
  <div class="login-container">
    <div class="login-header">
      <h1>Suporte Técnico</h1>
      <p>Acesso ao Painel</p>
    </div>

    <div id="loginError" class="login-error"></div>

    <form id="loginForm" class="login-form">
      <div class="form-group">
        <label for="loginEmail">Email</label>
        <input
          id="loginEmail"
          type="email"
          placeholder="seu.email@example.com"
          required
          autocomplete="email"
        >
      </div>

      <div class="form-group">
        <label for="loginPassword">Senha</label>
        <input
          id="loginPassword"
          type="password"
          placeholder="••••••••"
          required
          autocomplete="current-password"
        >
      </div>

      <button id="loginButton" type="submit" class="login-button">
        Entrar
      </button>
    </form>

    <div class="login-footer">
      Versão 1.0 | © Suporte Técnico
    </div>
  </div>

  <script type="module" src="./js/pages/login.js"></script>
</body>
</html>
